# v2 训练 Pod 清单（2026-09-22 复盘后配置）
# 变更 vs run-07 pod-manifest：
#   run id / 路径 → swegym-30b-tier0-r2；AGENT_LOOP_CONFIG → swe_agent_v2.yaml
#   VERL_MAX_RESPONSE_LENGTH 8192 → 16384；VERL_TRAIN_STEPS 50 → 100
#   VERL_AGENT_WORKERS 8 → 16；TEST/SAVE_FREQ 10 → 25
#   activeDeadlineSeconds 3 天 → 5 天（100 步 × ~40 分钟 ≈ 67h 上限）
apiVersion: v1
kind: Pod
metadata:
  name: swe-rl-swegym-30b-tier0-r2
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 432000
  containers:
    - name: train
      image: docker.io/verlai/verl@sha256:b867883b0dd011363e69ab2ab344922a28c5bd0409e2a324e3ee70fb27ca7543
      command: ["bash", "-c"]
      args:
        - |
          set -euo pipefail
          python -c 'import json; from pathlib import Path; p=Path("/mnt/cfs/swe-rl/model/Qwen3-Coder-30B-A3B-Instruct"); idx=json.loads((p/"model.safetensors.index.json").read_text()); shards=sorted(set(idx["weight_map"].values())); assert all((p/s).exists() and (p/s).stat().st_size>0 for s in shards), "shard missing"; cfg=json.loads((p/"config.json").read_text()); assert cfg["architectures"]==["Qwen3MoeForCausalLM"], cfg["architectures"]; print("MODEL_OK", len(shards), "shards", cfg.get("num_experts"), "experts", flush=True)'
          cd /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit
          sha256sum --status -c /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/protocol.sha256
          export PYTHONPATH=/mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/verl-src:/mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit
          python -m pip install --no-cache-dir 'accelerate==1.15.0' 'e2b==2.49.0' 'unidiff==0.7.5' 'swebench==5.0.2' 'tencentcloud-sdk-python-ags'
          mkdir -p /mnt/cfs/swe-rl/logs/swegym-30b-tier0-r2
          nvidia-smi --query-gpu=timestamp,index,memory.used,memory.total,utilization.gpu --format=csv --loop=30 > /mnt/cfs/swe-rl/logs/swegym-30b-tier0-r2/gpu.csv &
          GPU_MON_PID=$!
          trap 'kill "$GPU_MON_PID" 2>/dev/null || true' EXIT
          python -m sandbox.preflight \
            /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/data/tier0-r2/train.parquet \
            /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/data/tier0-r2/eval.parquet
          bash /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/configs/grpo_4l20_30b_v2.sh
          python -m controller.report_run --traces /mnt/cfs/swe-rl/traces/swegym-30b-tier0-r2 >> /mnt/cfs/swe-rl/logs/swegym-30b-tier0-r2/report.log 2>&1 || true
      env:
        - name: PYTHONPATH
          value: /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/verl-src:/mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit
        - name: E2B_DOMAIN
          value: ap-singapore.tencentags.com
        - name: E2B_API_KEY
          valueFrom:
            secretKeyRef:
              name: ags-credentials
              key: E2B_API_KEY
        - name: SWE_RUN_ID
          value: swegym-30b-tier0-r2
        - name: VERL_DATA
          value: /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/data/tier0-r2/train.parquet
        - name: VERL_VAL_DATA
          value: /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/data/tier0-r2/eval.parquet
        - name: VERL_REWARD_PATH
          value: /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/verl_plugin/reward.py
        - name: VERL_AGENT_LOOP_CONFIG
          value: /mnt/cfs/swe-rl/runs/swegym-30b-tier0-r2/kit/configs/swe_agent_v2.yaml
        - name: VERL_AGENT_NAME
          value: swe_ags
        - name: VERL_MAX_PROMPT_LENGTH
          value: "4096"
        - name: VERL_MAX_RESPONSE_LENGTH
          value: "16384"
        - name: VERL_TRAIN_STEPS
          value: "70"
        - name: VERL_TEST_FREQ
          value: "25"
        - name: VERL_SAVE_FREQ
          value: "5"
        - name: VERL_MAX_CKPT_KEEP
          value: "3"
        - name: VERL_FILTER_MAX_GEN
          value: "3"
        - name: VERL_AGENT_WORKERS
          value: "16"
        - name: RAY_memory_usage_threshold
          value: "0.97"
        - name: VERL_LOG_DIR
          value: /mnt/cfs/swe-rl/logs/swegym-30b-tier0-r2
        - name: VERL_REPORT_DIR
          value: /mnt/cfs/swe-rl/eval_reports/swegym-30b-tier0-r2
        - name: VERL_MODEL
          value: /mnt/cfs/swe-rl/model/Qwen3-Coder-30B-A3B-Instruct
        - name: VERL_OUT
          value: /mnt/cfs/swe-rl/checkpoints/swegym-30b-tier0-r2
        - name: HF_HOME
          value: /mnt/cfs/swe-rl/hf-cache
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: NPROC_PER_NODE
          value: "4"
        - name: VERL_RESUME_MODE
          value: auto
        - name: VERL_VAL_BEFORE_TRAIN
          value: "False"
      volumeMounts:
        - name: cfs
          mountPath: /mnt/cfs
        - name: dshm
          mountPath: /dev/shm
        - name: tccli-cred
          mountPath: /root/.tccli
          readOnly: true
      resources:
        limits:
          nvidia.com/gpu: "4"
          memory: 320Gi
          cpu: "96"

  volumes:
    - name: cfs
      persistentVolumeClaim:
        claimName: swe-rl-cfs
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
    - name: tccli-cred
      secret:
        secretName: tccli-credential
