apiVersion: v1
kind: Pod
metadata:
  name: swe-rl-eval-r2s70-p4
  labels:
    app: swe-rl-eval
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 172800
  # 不写 nodeName（吸取 run-09 教训）
  containers:
    - name: eval
      image: docker.io/verlai/verl@sha256:b867883b0dd011363e69ab2ab344922a28c5bd0409e2a324e3ee70fb27ca7543
      command: ["bash", "-c"]
      args:
        - |
          set -euo pipefail
          RUN=/mnt/cfs/swe-rl/runs/eval-30b-base-vs-lora
          cd "$RUN/kit"
          sha256sum --status -c protocol.sha256
          export PYTHONPATH="$RUN/kit:/mnt/cfs/swe-rl/runs/swegym-30b-tier0-r1/verl-src"
          python -m pip install --no-cache-dir 'e2b==2.49.0' 'unidiff==0.7.5' 'swebench==5.0.2' 'tencentcloud-sdk-python-ags' 'pandas' 'pyarrow'
          MODEL=/mnt/cfs/swe-rl/model/Qwen3-Coder-30B-A3B-Instruct-lora-r2s70
          OUT=/mnt/cfs/swe-rl/traces/eval-r2s70-t07/vllm-pass4
          LOG=/mnt/cfs/swe-rl/logs/eval-r2s70
          mkdir -p "$OUT" "$LOG"
          echo "=== [0/4] 合并模型完整性检查 ==="
          python -c "import json; from pathlib import Path; p=Path('$MODEL'); idx=json.loads((p/'model.safetensors.index.json').read_text()); shards=sorted(set(idx['weight_map'].values())); assert all((p/s).exists() and (p/s).stat().st_size>0 for s in shards); print('MODEL_OK', len(shards), 'shards', flush=True)"
          echo "=== [1/4] pass@4 批 a（samples 0-1）==="
          python controller/eval_driver.py \
            --parquet "$RUN/kit/data/heldout/heldout.parquet" \
            --out "$OUT" --model "$MODEL" --variant base \
            --n 2 --temperature 0.7 --sample-offset 0 \
            --max-steps 12 --action-tokens 2048 --observation-tokens 512 --workers 16 \
            2>&1 | tee "$LOG/eval-p4a-$(date -u +%Y%m%dT%H%M%SZ).log"
          echo "=== [2/4] pass@4 批 b（samples 2-3）==="
          python controller/eval_driver.py \
            --parquet "$RUN/kit/data/heldout/heldout.parquet" \
            --out "$OUT" --model "$MODEL" --variant base \
            --n 2 --temperature 0.7 --sample-offset 2 \
            --max-steps 12 --action-tokens 2048 --observation-tokens 512 --workers 16 \
            2>&1 | tee "$LOG/eval-p4b-$(date -u +%Y%m%dT%H%M%SZ).log"
          echo "=== [3/4] 三方对照汇总（r1-base vs r1-lora vs r2s70；此处先出 r2 自身指标）==="
          python scripts/summarize_pass4.py \
            --base /mnt/cfs/swe-rl/traces/eval-base-t0/vllm-pass4 \
            --lora "$OUT" \
            --out "$LOG/pass4-summary-r2s70.json" || true
          echo "=== [4/4] EVAL DONE ==="
      env:
        - name: E2B_DOMAIN
          value: ap-singapore.tencentags.com
        - name: E2B_API_KEY
          valueFrom:
            secretKeyRef:
              name: ags-credentials
              key: E2B_API_KEY
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: HF_HOME
          value: /mnt/cfs/swe-rl/hf-cache
      resources:
        limits:
          nvidia.com/gpu: 4
          cpu: "100"
          memory: 350Gi
      volumeMounts:
        - name: cfs
          mountPath: /mnt/cfs
        - name: dshm
          mountPath: /dev/shm
        - name: tccli-cred
          mountPath: /root/.tccli
          readOnly: true
  volumes:
    - name: cfs
      persistentVolumeClaim:
        claimName: swe-rl-cfs
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
    - name: tccli-cred
      secret:
        secretName: tccli-credential
