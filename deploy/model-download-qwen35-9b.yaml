apiVersion: v1
kind: Pod
metadata:
  name: swe-rl-model-download-qwen35-9b
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 14400
  nodeName: 10.0.0.60
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  containers:
    - name: dl
      image: python:3.11-slim
      env:
        - name: HF_HOME
          value: /mnt/cfs/swe-rl/hf-cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-credentials
              key: HF_TOKEN
      command: ["bash", "-c"]
      args:
        - |
          set -e
          pip install -q huggingface_hub requests
          python /mnt/cfs/swe-rl/kit/deploy/download_model.py \
            --repo Qwen/Qwen3.5-9B \
            --output /mnt/cfs/swe-rl/model/Qwen3.5-9B
          echo DONE
          du -sh /mnt/cfs/swe-rl/model/Qwen3.5-9B
      resources:
        limits: {cpu: "8", memory: 16Gi}
      volumeMounts:
        - name: cfs
          mountPath: /mnt/cfs
  volumes:
    - name: cfs
      persistentVolumeClaim:
        claimName: swe-rl-cfs
