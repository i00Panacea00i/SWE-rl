apiVersion: v1
kind: Pod
metadata:
  name: swe-rl-sync
spec:
  restartPolicy: Never
  containers:
    - name: sync
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: "100m", memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      volumeMounts:
        - name: cfs
          mountPath: /mnt/cfs
  volumes:
    - name: cfs
      persistentVolumeClaim:
        claimName: swe-rl-cfs
